<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OC Cheetahs - Player Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --cheetah-gold: #f4b321;
      --cheetah-orange: #ff7a00;
      --cheetah-black: #000000;
      --cheetah-white: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #050505;
      color: var(--cheetah-white);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,122,0,0.15), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(244,179,33,0.12), transparent 60%);
      animation: bgPulse 8s infinite alternate;
      z-index: -1;
    }

    @keyframes bgPulse {
      0% { opacity: 0.4; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.3); }
    }

    header {
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      border-bottom: 3px solid var(--cheetah-orange);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid var(--cheetah-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: var(--cheetah-gold);
    }

    .site-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 16px;
      font-size: 14px;
    }

    nav a {
      color: var(--cheetah-white);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
    }

    nav a:hover {
      border-bottom-color: var(--cheetah-orange);
      color: var(--cheetah-gold);
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    section {
      margin-top: 20px;
      margin-bottom: 40px;
      border: 1px solid #222;
      background: #0b0b0b;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(255,122,0,0.25);
      transition: 0.3s ease;
    }

    section:hover {
      box-shadow: 0 0 40px rgba(255,122,0,0.45);
      transform: translateY(-3px);
    }

    section h2 {
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 12px;
      color: var(--cheetah-gold);
      text-align: center;
    }

    .section-sub {
      font-size: 13px;
      color: #bbbbbb;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Registration form input groups */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: var(--cheetah-gold);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: var(--cheetah-white);
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--cheetah-orange);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--cheetah-orange);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      color: var(--cheetah-black);
      text-transform: uppercase;
      font-size: 14px;
      transition: 0.25s;
    }

    button:hover {
      background: var(--cheetah-gold);
    }

    footer {
      border-top: 1px solid #222;
      padding: 16px;
      text-align: center;
      font-size: 11px;
      color: #888;
      background: #050505;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-wrap">
      <div class="logo-circle">OC</div>
      <div class="site-title">OC Cheetahs Baseball</div>
    </div>

    <nav>
      <a href="index42.html#home">Home</a>
      <a href="index42.html#about">About</a>
      <a href="index42.html#contact">Contact</a>
      <a href="index42.html#portal">Portal</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Player Registration</h2>
      <p class="section-sub">Complete your official team registration and choose your preferences.</p>

      <form id="registration-form">
        <div class="form-group">
          <label for="playerName">Player Full Name</label>
          <input type="text" id="playerName" placeholder="First and Last" required />
        </div>

        <div class="form-group">
          <label for="playerAge">Player Age</label>
          <input type="number" id="playerAge" placeholder="Age" min="4" max="18" required />
        </div>

        <div class="form-group">
          <label for="parentName">Parent / Guardian Name</label>
          <input type="text" id="parentName" placeholder="Primary Contact" required />
        </div>

        <div class="form-group">
          <label for="parentPhone">Parent Phone Number</label>
          <input type="tel" id="parentPhone" placeholder="(555) 555-5555" required />
        </div>

        <div class="form-group">
          <label for="jerseyNumber">Jersey Number Preference</label>
          <input type="number" id="jerseyNumber" placeholder="First Choice (0-99)" min="0" max="99" required />
        </div>

        <div class="form-group">
          <label for="playerPosition">Preferred Position</label>
          <select id="playerPosition" required>
            <option value="" disabled selected>Select a position</option>
            <option value="Pitcher">Pitcher</option>
            <option value="Catcher">Catcher</option>
            <option value="Infield">Infield</option>
            <option value="Outfield">Outfield</option>
            <option value="Utility">Utility</option>
          </select>
        </div>

        <div class="form-group">
          <label for="medicalNotes">Allergies or Medical Concerns</label>
          <textarea id="medicalNotes" placeholder="Please list any concerns, allergies, or type 'None'"></textarea>
        </div>

        <button type="submit">Submit Registration</button>
      </form>
    </section>
  </main>

  <footer>
    © <span id="year"></span> OC Cheetahs Baseball • Built with speed and heart.
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZ-VTNXCfO_Q2_nZH9xfDBV2kru-SGL0s",
      authDomain: "occheetahs-d9f65.firebaseapp.com",
      projectId: "occheetahs-d9f65",
      storageBucket: "occheetahs-d9f65.firebasestorage.app",
      messagingSenderId: "630995310063",
      appId: "1:630995310063:web:75304dc8476cecc55f521a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("registration-form");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = document.getElementById("playerName").value.trim();
      const age = parseInt(document.getElementById("playerAge").value);
      const parentName = document.getElementById("parentName").value.trim();
      const parentPhone = document.getElementById("parentPhone").value.trim();
      const jersey = parseInt(document.getElementById("jerseyNumber").value);
      const position = document.getElementById("playerPosition").value;
      const medicalNotes = document.getElementById("medicalNotes").value.trim() || "None";

      addDoc(collection(db, "registrations"), {
        playerName: name,
        playerAge: age,
        parentName: parentName,
        parentPhone: parentPhone,
        jerseyNumberPreference: jersey,
        preferredPosition: position,
        medicalAllergies: medicalNotes,
        submittedAt: new Date().toISOString()
      })
      .then(() => {
        alert("Registration submitted successfully! Welcome to the team roster.");
        form.reset();
        window.location.href = "index42.html";
      })
      .catch((error) => {
        console.error("Firestore write error: ", error);
        alert("Failed to submit registration. Please check your connection and try again.");
      });
    });
  </script>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
